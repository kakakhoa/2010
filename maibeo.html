<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>A Little Love Letter</title>
	<style>
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			overflow: hidden;
			background: linear-gradient(135deg, #ffe3ed, #ffcddd 55%, #fff1f5);
			color: #89566a;
			font-family: "Segoe Print", "Comic Sans MS", "Segoe UI", Arial, sans-serif;
		}
		.decoration {
			position: fixed;
			z-index: 0;
			pointer-events: none;
			user-select: none;
			animation: float 5s ease-in-out infinite;
		}
		.heart { color: #ee8eae; }
		.sparkle { color: #d99bb6; }
		.one { top: 9%; left: 12%; font-size: 3rem; }
		.two { top: 18%; right: 14%; font-size: 2.3rem; animation-delay: -2s; }
		.three { bottom: 13%; left: 17%; font-size: 2.5rem; animation-delay: -1s; }
		.four { bottom: 10%; right: 12%; font-size: 3rem; animation-delay: -3s; }
		.five { top: 48%; left: 5%; font-size: 1.8rem; animation-delay: -2s; }
		.six { top: 55%; right: 6%; font-size: 1.8rem; animation-delay: -3s; }
		.letter {
			position: relative;
			z-index: 1;
			width: min(650px, calc(100vw - 36px));
			min-height: 74vh;
			padding: clamp(28px, 6vw, 54px);
			border: 2px solid #f5bfd2;
			border-radius: 8px 8px 18px 8px;
			background: #fffaf7;
			box-shadow: 0 18px 50px #c7678740, 0 4px 12px #c7678720;
			transform: rotate(-1deg);
		}
		.letter::before {
			content: "✿";
			position: absolute;
			top: 15px;
			right: 20px;
			color: #ed9bb7;
			font-size: 1.5rem;
		}
		h1 {
			margin: 0 0 8px;
			color: #d67596;
			font-size: clamp(1.7rem, 5vw, 2.3rem);
			font-weight: 600;
			text-align: center;
		}
		.hint { margin: 0 0 22px; color: #bd899b; text-align: center; }
		textarea {
			display: block;
			width: 100%;
			height: calc(74vh - 190px);
			min-height: 260px;
			resize: vertical;
			border: 0;
			outline: 0;
			background: repeating-linear-gradient(to bottom, transparent 0, transparent 34px, #f4dce4 35px, transparent 36px);
			color: #765464;
			font: 1rem/36px "Segoe Print", "Comic Sans MS", "Segoe UI", Arial, sans-serif;
		}
		textarea::placeholder { color: #d4b5c0; }
		@keyframes float {
			0%, 100% { transform: translateY(0) rotate(-8deg); }
			50% { transform: translateY(-12px) rotate(8deg); }
		}
		@media (max-width: 520px) {
			.letter { min-height: 78vh; transform: none; }
			textarea { height: calc(78vh - 190px); }
			.five, .six { display: none; }
		}
		.back-button {
			display: inline-block;
			margin-bottom: 16px;
			padding: 6px 12px;
			border: 1px solid #f5bfd2;
			border-radius: 20px;
			color: #d67596;
			text-decoration: none;
			font-size: 0.9rem;
		}
		.back-button:hover { background: #fff1f5; }
	</style>
</head>
<body>
	<span class="decoration heart one" aria-hidden="true">♥</span>
	<span class="decoration sparkle two" aria-hidden="true">✦</span>
	<span class="decoration heart three" aria-hidden="true">♡</span>
	<span class="decoration sparkle four" aria-hidden="true">✿</span>
	<span class="decoration sparkle five" aria-hidden="true">✧</span>
	<span class="decoration heart six" aria-hidden="true">♥</span>
	<main class="letter">
		<a class="back-button" href="index.html">← Back</a>
		<h1>20 / 10 cho mai beo'</h1>
		<p class="hint">from mk</p>
		<textarea aria-label="Write your letter" placeholder="Dear mai beo',&#10;&#10;Mai 20/10 zui zẻ, hạnh phúc, đẹp gái (nhưng mà bớt les lại).&#10;Thi tốt qua môn (đừng thi 3đ nx t lạy m)&#10;&#10;Nào có vé concert thì cho tui đi nx nhe<3" readonly></textarea>
	</main>
</body>
</html>
